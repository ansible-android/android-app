name: Build debug APK

on:
  push:
    branches: [master, '12.10.1']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      qualify_run_id:
        description: 'Qualify an existing private APK without rebuilding (empty builds sources).'
        type: string
        default: ''
      source_sha:
        description: 'Exact source SHA of the existing APK.'
        type: string
        default: ''
      publish:
        description: 'Publish the exact qualified APK after Desktop 0.4.3.'
        type: boolean
        default: false

permissions:
  contents: write   # для прикрепления APK к Release при tag push

jobs:
  build:
    if: ${{ inputs.qualify_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install SDK packages
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Cache Gradle
        id: gradle-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Compile the main Java and AIDL sources before native assembly
        run: |
          chmod +x ./gradlew
          ./gradlew :Ansible:compileStandaloneJavaWithJavac --no-daemon --stacktrace

      - name: Preserve downloaded Gradle dependencies
        if: always() && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

      - name: Build AppStandalone debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :Ansible_AppStandalone:assembleAfatStandalone --no-daemon --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find Ansible_AppStandalone/build/outputs/apk -name '*.apk' | head -1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "name=ansible-android-$(date +%Y%m%d)-$(git rev-parse --short HEAD).apk" >> "$GITHUB_OUTPUT"
          ls -la "$APK_PATH"
          # On a version tag, attach a branded copy (ansible-<version>.apk) to the Release.
          VERSION="${GITHUB_REF#refs/tags/v}"
          if [ "$VERSION" != "$GITHUB_REF" ]; then
            RELEASE_APK="ansible-${VERSION}.apk"
            cp "$APK_PATH" "$RELEASE_APK"
            echo "release_apk=$RELEASE_APK" >> "$GITHUB_OUTPUT"
            ls -la "$RELEASE_APK"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Attach APK to Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.release_apk }}
          fail_on_unmatched_files: true

  qualify:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.qualify_run_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      APK_BUILD_RUN: ${{ inputs.qualify_run_id }}
      APK_SOURCE_SHA: ${{ inputs.source_sha }}
      APK_PUBLISH: ${{ inputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools emulator platforms;android-36 build-tools;36.0.0 system-images;android-36;google_apis;x86_64'
      - name: Qualify the exact APK and in-place data upgrade
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          python3 scripts/ci/qualify_android_release.py
      - name: Preserve private qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-0.4.3-qualified-${{ inputs.source_sha }}
          path: release-qualification/
          if-no-files-found: warn
      - name: Publish the qualified artifact after Desktop
        if: inputs.publish
        run: python3 scripts/ci/qualify_android_release.py --publish
